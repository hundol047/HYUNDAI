name: Stop plan APK recording
on:
  push:
    branches: [fix/vehicle-runtime-issues]
    paths:
      - preview/퓨처랩스_CabinOS_ONE_preview.apk
      - scripts/record_stop_plan.py
      - scripts/record_navigation_review.py
      - .github/workflows/stop-plan-video.yml
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute the published preview and record continuous device frames
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/record-android-demo.py --serial emulator-5554 --apk preview/퓨처랩스_CabinOS_ONE_preview.apk --package io.cabinos.one.preview --stop-plan --output artifacts/stop-plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stop-plan-execution
          path: artifacts/stop-plan/
  navigation-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise live navigation, map pan and orientation changes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/record-android-demo.py --serial emulator-5554 --apk preview/퓨처랩스_CabinOS_ONE_preview.apk --package io.cabinos.one.preview --navigation-review --output artifacts/navigation-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-usability-execution
          path: artifacts/navigation-review/
