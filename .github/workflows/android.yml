name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify optional place gateway without live provider calls
        run: python3 -m unittest discover -s server -v
      - name: Verify vehicle recording evidence checks
        run: python3 -m unittest discover -s scripts/tests -v
      # ubuntu-24.04 already includes the Android SDK and accepted SDK licenses.
      - name: Install pinned Android platform and build tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :core:jsBrowserDistribution :app:testDebugUnitTest :app:assembleDebug --console=plain
      - run: ./gradlew :app:assembleRelease --console=plain
      - run: ./gradlew :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CabinOS-ONE-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/lint-results-debug.html
            core/build/reports/tests/jvmTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/screenshots/
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The ordinary Android emulator validates APK execution, not Pleos services.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and record the exact signed candidate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/record-android-demo.py --serial emulator-5554 --apk apk/퓨처랩스_CabinOS_ONE_release.apk --output artifacts/android-device-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CabinOS-Android-APK-device-video
          path: artifacts/android-device-demo/
