name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # ubuntu-24.04 already includes the Android SDK and accepted SDK licenses.
      - name: Install pinned Android platform and build tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :core:jsBrowserDistribution :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CabinOS-ONE-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/lint-results-debug.html
            core/build/reports/tests/jvmTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/screenshots/
