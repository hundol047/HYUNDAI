name: Publish CabinOS ONE demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/build-web.sh
      - run: npm ci --prefix scripts/web --no-audit --no-fund
      - run: /usr/bin/google-chrome --version
      - name: Verify browser behavior and release download
        env:
          CABIN_CHROME: /usr/bin/google-chrome
        run: |
          python3 scripts/serve-web.py --directory build/site > /tmp/cabinos-preview.log 2>&1 &
          cabin_server_pid=$!
          trap 'kill "$cabin_server_pid"' EXIT
          node scripts/web/verify.cjs
          node scripts/web/verify-map.cjs
          node scripts/web/verify-navigation.cjs
          node scripts/web/verify-appearance.cjs
          node scripts/web/verify-place-search.cjs
          node scripts/web/verify-navigation-detail.cjs
          node scripts/web/verify-gps.cjs
          CABIN_CPU_RATE=1 node scripts/web/verify-map-performance.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
